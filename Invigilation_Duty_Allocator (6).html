function seed(){const li=ROST.findIndex(n=>/lalini/i.test(n));return{staff:ROST.map((n,i)=>({id:i+1,name:n,group:i<4?'SENIOR':i>=li?'LAB':'FACULTY',active:true,prev:0})),series:[],nid:ROST.length+1,view:null,seed:1,tt:null,form:{title:'',days:[]},cfg:{lab:0.96,cap:3,sen:0.6,dbl:true,fn:[1,4],an:[5,7],coord:'',hod:''}}}

const cmp=n=>String(n).toLowerCase().replace(/\(.*?\)/g,'').replace(/\b(dr|mr|mrs|ms)\b\.?/g,'').replace(/[^a-z]/g,'');
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}

function blocked(s,iso,ses,sems){const dw=new Date(iso+'T00:00:00').getDay(),e=ttOf(s);if(!e||dw<1||dw>5)return false;
 const [a,b]=win(ses);for(let p=a;p<=b;p++){const c=e.c[(dw-1)+'-'+p];if(c&&!(c.length&&c.every(x=>sems.includes(x))))return true}return false}
/* ---------- exemptions ---------- */
const isEx=(ex,id,x)=>!!(ex&&ex[id]&&ex[id].includes(x.date+'|'+x.ses));

function exRange(){const a=$('#xs').value,L=slotsOf();let i=L.indexOf($('#xf').value),j=L.indexOf($('#xt').value);if(i<0||j<0||!a)return;if(i>j)[i,j]=[j,i];const ex=S.form.ex=S.form.ex||{},set=new Set(ex[a]||[]);L.slice(i,j+1).forEach(x=>set.add(x));ex[a]=[...set];save();render()}

 const [iso,ses]=AV.k.split('|'),d=S.form.days.find(x=>x.date===iso),sems=d?d.sems:[],[a,b]=win(ses),ps=[];for(let p=a;p<=b;p++)ps.push(p);
 const rows=S.staff.filter(s=>s.active&&s.group!=='EXEMPT').map(s=>{const c=ps.map(p=>cellSt(s,iso,p,sems));return{s,c,no:!ttOf(s),busy:c.some(x=>x.t==='busy'),sm:[...new Set(c.filter(x=>x.l).flatMap(x=>x.l.split('/')))].sort().join(', ')}});
 rows.sort({avail:(x,y)=>x.busy-y.busy,busy:(x,y)=>y.busy-x.busy,sem:(x,y)=>(x.sm||'~').localeCompare(y.sm||'~')||x.busy-y.busy}[AV.sort]);
 const nf=rows.filter(x=>!x.busy).length,op=(v,l)=>`<option value='${v}'${AV.sort===v?' selected':''}>${l}</option>`;
 return `<div class='card'><h2>Timetable availability map</h2><p class='mu sm'>Each teacher in the exam periods. Free = no class, or a class of a semester that is in the exam (that class is cancelled). In class = a class of another semester, so not available for duty.</p>
 <div class='row'><select onchange='AV.k=this.value;render()'>${L.map(k=>`<option value='${k}'${k===AV.k?' selected':''}>${slLab(k)} (periods ${a}-${b})</option>`).join('')}</select><select onchange='AV.sort=this.value;render()'>${op('avail','Sort: free first')}${op('busy','Sort: in class first')}${op('sem','Sort: by semester (S3, S5, S7)')}</select><span class='sm'>${nf} of ${rows.length} free. Exam semesters: ${sems.join(', ')||'none ticked'}</span></div>
 <div class='sc'><table><tr><th>Name</th><th>Category</th>${ps.map(p=>`<th>Period ${p}</th>`).join('')}<th>Classes</th><th>Result</th></tr>${rows.map(x=>`<tr><td class='n'>${esc(x.s.name)}</td><td class='sm'>${GL[x.s.group]}</td>${x.c.map(c=>`<td class='${c.t==='busy'?'blk':''}'>${c.t==='free'?'free':c.t==='can'?c.l+' (exam)':c.l}</td>`).join('')}<td class='sm'>${x.sm||'-'}</td><td class='${x.busy?'er':'ok'}'>${x.busy?'In class':x.no?'Free (no timetable)':'Free'}</td></tr>`).join('')}</table></div></div>`}
function vEx(){const L=slotsOf(),act=sorted().filter(s=>s.active&&s.group!=='EXEMPT'),ex=S.form.ex||{},pe=prefEx(),n=Object.values(ex).reduce((a,b)=>a+b.length,0);
 if(!L.length)return '';const op=L.map(k=>`<option value="${k}">${slLab(k)}</option>`).join('');
 return `<div class="card"><h2>Exempt from duty (optional)</h2><p class="mu sm">Pick a person and a range of slots, or tick individual slots in the grid. Ticked (red ✕) slots will not be given to that person. Range works across days, e.g. 24-11 FN to 26-11 AN.</p>
 <div class="row"><select id="xs">${act.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><span>from</span><select id="xf">${op}</select><span>to</span><select id="xt">${op}</select><button class="b p" onclick="exRange()">Exempt range</button><button class="b d" onclick="exClr()">Clear all (${n})</button></div>

/* ---------- allocator ---------- */
function allocate(sr,seedN){
 const el=S.staff.filter(s=>s.active&&s.group!=='EXEMPT'),sl=sr.slots,ns=sl.length,dates=[...new Set(sl.map(x=>x.date))],D=sl.reduce((a,b)=>a+b.need,0);if(!el.length)return null;
 const w=s=>(S.cfg.pct[s.group]||100)/100;
 const ok={};el.forEach(s=>ok[s.id]=sl.map(x=>!blocked(s,x.date,x.ses,x.sems)&&!isEx(sr.ex,s.id,x)));
 const av=sl.map((_,k)=>el.filter(s=>ok[s.id][k]).length);
 let m=1;const mx=s=>Math.max(1,Math.round(S.cfg.base*w(s)*m));while(el.reduce((a,s)=>a+mx(s),0)<D*1.15&&m<20)m+=.1;const cp={};el.forEach(s=>cp[s.id]=mx(s));let best=null,bs=1e18;
 for(let t=0;t<200;t++){const r=rng(seedN*1000+t),c={},dy={},sd=Array(ns).fill(0);el.forEach(s=>{c[s.id]=0;dy[s.id]=[]});let short=0;
  const order=sl.map((_,k)=>k).sort((a,b)=>(av[a]-sl[a].need)-(av[b]-sl[b].need)+(r()-.5)*3);
  for(const k of order){const di=dates.indexOf(sl[k].date);
   for(let j=0;j<sl[k].need;j++){let pick=null,ps=1e9;
    for(const pass of [0,1]){for(const s of el){if(!ok[s.id][k]||dy[s.id].includes(k)||(pass===0&&c[s.id]>=cp[s.id]))continue;
     const ds=dy[s.id].map(x=>dates.indexOf(sl[x].date));if(ds.includes(di)&&!S.cfg.dbl)continue;
     let sc=(s.prev+c[s.id])/w(s)+r()*.9;if(ds.includes(di))sc+=2;if(ds.some(x=>Math.abs(x-di)===1))sc+=.7;if(pass)sc+=6;
     if(s.group==='SENIOR')sc+=sd[k]*.8;
     if(sc<ps){ps=sc;pick=s}}if(pick)break}
    if(!pick)short++;else{c[pick.id]++;dy[pick.id].push(k);if(pick.group==='SENIOR')sd[k]++}}}
  const v=el.map(s=>(s.prev+c[s.id])/w(s)),m=v.reduce((a,b)=>a+b,0)/v.length;
  const sc=short*1000+v.reduce((a,b)=>a+(b-m)**2,0)/v.length+.15*el.reduce((a,s)=>a+dy[s.id].filter(x=>dy[s.id].some(y=>Math.abs(dates.indexOf(sl[y].date)-dates.indexOf(sl[x].date))===1)).length,0);

function generate(bump){const f=S.form,slots=[];
 f.days.forEach(d=>{dsl(d).forEach(([ses,n])=>{if(n>0)slots.push({date:d.date,ses,need:n,sems:[...d.sems]})})});

/* ---------- parsing uploaded sheets ---------- */
async function readWB(inp){const f=inp.files[0];return f?XLSX.read(await f.arrayBuffer(),{type:'array'}):null}
function parseDuty(ws){const A=XLSX.utils.sheet_to_json(ws,{header:1,defval:null}),T=c=>String(c==null?'':c);
 const h=A.findIndex(r=>r.some(c=>/prev/i.test(T(c)))&&r.some(c=>/name/i.test(T(c))));if(h<0)return null;
 const H=A[h],pc=H.findIndex(c=>/prev/i.test(T(c))),tc=H.findIndex(c=>/total/i.test(T(c))),nc=H.findIndex(c=>/name/i.test(T(c))),cc=H.findIndex(c=>/^count/i.test(T(c).trim()));
 const dc=[];H.forEach((c,i)=>{const m=/(\d{2})-(\d{2})-(\d{4})/.exec(T(c));if(m)dc.push({i,date:m[3]+'-'+m[2]+'-'+m[1]})});if(!dc.length)return null;
 const hasT=A[h+1]&&/timing/i.test(T(A[h+1][0])),Tr=hasT?A[h+1]:null,end=cc>=0?cc:tc>=0?tc:H.length;
 let r=h+(hasT?2:1);const people=[];for(;r<A.length;r++){const R=A[r];if(typeof R[0]!=='number'||!R[nc])break;const pv=+R[pc]||0,ct=R.slice(dc[0].i,end).reduce((a,b)=>a+(+b||0),0);people.push({name:String(R[nc]).trim(),total:tc>=0&&R[tc]!=null&&R[tc]!==''?+R[tc]:pv+ct})}
 const req=A.slice(r,r+3).find(R=>R&&R.slice(3).some(x=>typeof x==='number'))||null,slots=[];let cur=null;
 for(let i=dc[0].i;i<end;i++){const m=dc.find(d=>d.i===i);if(m)cur=m.date;const ses=Tr?T(Tr[i]).toUpperCase():'FN';if(!cur||(Tr&&!/^(FN|AN)$/.test(ses)))continue;slots.push({date:cur,ses,need:req?+req[i]||0:8})}

function parseTT(ws){const A=XLSX.utils.sheet_to_json(ws,{header:1,defval:null}),out=[];
 for(const R of A){if(typeof R[0]!=='number'||!R[1])continue;const c={};
  for(let d=0;d<5;d++)for(let p=1;p<=7;p++){const v=R[2+8*d+p-1];if(v){const m=String(v).match(/\bS\s?[1-8]\b/gi)||[];c[d+'-'+p]=[...new Set(m.map(x=>'S'+x.replace(/\D/g,'')))]}}
  out.push({name:String(R[1]).trim(),c})}return out}
async function upDuty(inp){UI.wb=await readWB(inp);UI.sh=UI.wb?UI.wb.SheetNames[0]:null;UI.msg='';render()}
async function upTT(inp){const wb=await readWB(inp);if(!wb)return;const tt=parseTT(wb.Sheets[wb.SheetNames[0]]);if(!tt.length){UI.ttmsg='No teacher rows found. Expected the Individual Faculty TT layout (5 days x 7 periods).';render();return}
 S.tt=tt;save();UI.ttmsg='';render()}
function curParsed(){return UI.wb?parseDuty(UI.wb.Sheets[UI.sh]):null}
function applyCounts(){const p=curParsed();if(!p||!p.people.length)return;const li=p.people.findIndex(x=>/lalini/i.test(x.name)),used=new Set(),ord=[];let upd=0,add=0;
 p.people.forEach((x,i)=>{let s=S.staff.find(t=>!used.has(t.id)&&same(t.name,x.name));if(!s){s={id:S.nid++,name:x.name,group:li>=0&&i>=li?'LAB':'FACULTY',active:true,prev:0};S.staff.push(s);add++}else upd++;s.prev=x.total;s.active=true;used.add(s.id);ord.push(s)});

function loadReq(){const p=curParsed();if(!p)return;const days=[];p.slots.forEach(s=>{let d=days.find(x=>x.date===s.date);if(!d){d={date:s.date,fn:0,an:0,sems:[]};days.push(d)}d[s.ses==='AN'?'an':'fn']=s.need});

/* ---------- export ---------- */

/* ---------- explainable allocation: why was a person not given duty ---------- */
let AX={id:'',k:'all'};
const wOf=r=>(S.cfg.pct[r.group]||100)/100;
function slotWhy(sr,r,k){
 const st=S.staff.find(x=>x.id===r.id),x=sr.slots[k],mine=sr.duty[r.id]||[],on=mine.includes(k),
  asg=sr.rows.filter(q=>(sr.duty[q.id]||[]).includes(k)),dates=[...new Set(sr.slots.map(q=>q.date))],di=dates.indexOf(x.date);
 if(on)return{t:'yes',m:'Assigned to this slot.'};
 if(isEx(sr.ex,r.id,x)){const pf=(S.pref||[]).find(p=>same(p.name,r.name)&&x.date>=p.from&&x.date<=p.to&&(p.ses==='BOTH'||p.ses===x.ses));
  return{t:'ex',m:'Exempt: '+(pf?'preference sheet'+(pf.reason?' ('+pf.reason+')':''):'marked exempt manually')+'.'}}
 if(st&&blocked(st,x.date,x.ses,x.sems)){const e=ttOf(st),dw=new Date(x.date+'T00:00:00').getDay(),[a,b]=win(x.ses),ls=[];
  for(let p=a;p<=b;p++){const c=e.c[(dw-1)+'-'+p];if(c&&!(c.length&&c.every(q=>x.sems.includes(q))))ls.push('P'+p+(c.length?' ('+c.join('/')+')':''))}
  return{t:'cls',m:'In class during '+ls.join(', ')+' (semester not in this exam).'}}
 const cap=sr.cap&&sr.cap[r.id];
 if(cap&&mine.length>=cap)return{t:'cap',m:'Already at the maximum of '+cap+' duties for this series ('+(GL[r.group]||'')+' load '+(S.cfg.pct[r.group]||100)+'%).'};
 const ds=mine.map(q=>dates.indexOf(sr.slots[q].date));
 if(ds.includes(di)&&!S.cfg.dbl)return{t:'dbl',m:'Already has duty on this day and FN+AN on the same day is switched off.'};
 const extra=ds.some(q=>Math.abs(q-di)===1)?' Also has duty on a neighbouring day, which lowers priority.':ds.includes(di)?' Also has another duty the same day, which lowers priority.':'';
 if(asg.length>=x.need){const me=(r.prev+mine.length)/wOf(r),av=asg.length?asg.reduce((s,q)=>s+(q.prev+cnt(sr,q.id)-1)/wOf(q),0)/asg.length:0;
  const why=me>av+.5?'Those chosen had a lower load (counted before this duty), so they came first.':me>=av-.5?'Loads were close, so the allocator\'s small random tie-break decided'+(r.group==='SENIOR'?', along with the rule that spreads senior staff across slots':'')+'.':'This person had a lower load than those chosen, but was not picked. The allocator adds a small random element (about one duty) so the same people are not always chosen, fills the scarcest slots first'+(r.group==='SENIOR'?' and spreads senior staff across slots':'')+'. Tick this cell by hand, or Regenerate, to add them.';
  return{t:'full',m:'Free, but the slot was already full ('+asg.length+' of '+x.need+'). Weighted load (previous + duties, divided by load %) is '+me.toFixed(1)+' for this person against '+av.toFixed(1)+' average for those chosen. '+why+extra}}
 return{t:'open',m:'Free and not assigned. The slot is still short, so this was left open or removed by hand.'+extra}}
function whySum(sr,r){const st=S.staff.find(x=>x.id===r.id),n={yes:0,ex:0,cls:0,full:0,cap:0,dbl:0,open:0};sr.slots.forEach((_,k)=>n[slotWhy(sr,r,k).t]++);
 const all=sr.rows.filter(q=>q.group!=='EXEMPT'),ld=q=>(q.prev+cnt(sr,q.id))/wOf(q),avg=all.reduce((s,q)=>s+ld(q),0)/(all.length||1),me=ld(r),tot=sr.slots.length;
 let v;if(n.yes===0){const why=[];if(n.cls)why.push('in class for '+n.cls+' slot'+(n.cls>1?'s':''));if(n.ex)why.push('exempt for '+n.ex);if(n.full)why.push('free for '+n.full+' slot'+(n.full>1?'s':'')+' but they were filled by others first (see the reasons below)');if(n.cap)why.push('at maximum duties');
  v='No duty this series: '+(why.join('; ')||'no slot available')+'.'}
 else v='Given '+n.yes+' of '+tot+' slots. Blocked by class in '+n.cls+', exempt in '+n.ex+', free but not chosen in '+(n.full+n.cap+n.dbl+n.open)+'.';
 return v+' Weighted load after this series: '+me.toFixed(1)+' (department average '+avg.toFixed(1)+').'+(st&&S.tt&&!ttOf(st)?' No timetable found for this person, so they are treated as always free.':'')}
function vExplain(sr){const rows=sr.rows.filter(r=>r.group!=='EXEMPT');if(!rows.length)return '';if(!rows.some(r=>r.id===AX.id))AX.id=rows[0].id;if(AX.k!=='all'&&!sr.slots[+AX.k])AX.k='all';
 const r=rows.find(q=>q.id===AX.id),lab=k=>fd(sr.slots[k].date).slice(0,5)+' '+sr.slots[k].ses,ks=AX.k==='all'?sr.slots.map((_,k)=>k):[+AX.k],cl={yes:'ok',ex:'er',cls:'er',cap:'mu',dbl:'mu',full:'mu',open:'er'},tag={yes:'Assigned',ex:'Exempt',cls:'In class',cap:'At max',dbl:'Same day',full:'Slot full',open:'Not assigned'};

  E.days.sort((a,b)=>a.date<b.date?-1:1);parts.push(E.days.length+' exam days')}
 const act=activeSems();E.days.forEach(d=>{if(!d.sems.length)d.sems=[...act]});E.alloc=null;save();SU.ok=true;SU.msg='Loaded '+parts.join(', ')+'. Semesters with no class are skipped.';render()}
const activeSems=()=>[...new Set(SE().classes.filter(c=>c.active&&c.sem).map(c=>c.sem))].sort();
/* allocation */
function seatGenerate(){const E=SE();if(!E.classes.some(c=>c.active)||!E.rooms.some(r=>r.active)||!E.days.length){alert('Add classes, rooms and exam days first (upload the sheet or add them below).');return}
 if(E.alloc&&!confirm('Regenerate? Manual edits to the current arrangement will be lost.'))return;
 E.alloc=E.days.map(d=>{const sems=d.sems.length?d.sems:activeSems(),pool=E.rooms.filter(r=>r.active),rows=[];let p=0;
  E.classes.map((c,i)=>[c,i]).filter(([c])=>c.active&&sems.includes(c.sem)).sort((a,b)=>a[0].sem.localeCompare(b[0].sem)||a[1]-b[1]).forEach(([c])=>{const rolls=parseRolls(c.rolls),n=rolls.length,sel=[];let acc=0;
   while(acc<n&&p<pool.length){sel.push(pool[p]);acc+=pool[p].cap;p++}
   const m=Math.min(n,acc),sc=sel.reduce((a,r)=>a+r.cap,0),cnt=sel.map(r=>Math.min(r.cap,Math.floor(m*r.cap/(sc||1))));let left=m-cnt.reduce((a,b)=>a+b,0);
   while(left>0){let bi=-1,bv=-1;sel.forEach((r,i)=>{const v=r.cap-cnt[i];if(v>bv){bv=v;bi=i}});if(bi<0||bv<=0)break;cnt[bi]++;left--}
   let at=0;sel.forEach((r,i)=>{if(!cnt[i])return;rows.push({room:r.name,cls:c.name,rolls:fmtRolls(rolls.slice(at,at+cnt[i])),n:cnt[i]});at+=cnt[i]});
   if(at<n)rows.push({room:'',cls:c.name,rolls:fmtRolls(rolls.slice(at)),n:n-at})});
  return{date:d.date,time:d.time,sems:[...sems],rows}});
 E.gen=now();SU.edit=false;save();render()}
function seatChecks(){const E=SE(),out=[];(E.alloc||[]).forEach(d=>{const lab=dsh(d.date),seen={},tot={};
 d.rows.forEach(r=>{const key=String(r.room).trim().toLowerCase(),rm=E.rooms.find(x=>x.name.trim().toLowerCase()===key);
  if(!key)out.push({t:'e',m:`${lab}: ${r.cls||'row'} (${r.n}) has no room. Not enough rooms.`});
  else{if(!rm)out.push({t:'e',m:`${lab}: room ${r.room} is not in the room list`});else if(r.n>rm.cap)out.push({t:'e',m:`${lab}: ${r.room} holds ${rm.cap} but has ${r.n}`});seen[key]=(seen[key]||0)+1;if(seen[key]===2)out.push({t:'w',m:`${lab}: ${r.room} is used for more than one class`})}
  const ck=String(r.cls).trim().toLowerCase();tot[ck]=(tot[ck]||0)+(+r.n||0)});
 E.classes.filter(c=>c.active&&d.sems.includes(c.sem)).forEach(c=>{const t=tot[c.name.trim().toLowerCase()]||0;if(t!==c.n)out.push({t:'e',m:`${lab}: ${c.name} has ${c.n} students but ${t} are seated`})})});return out}
/* edit handlers */
function seC(i,k,v){const c=SE().classes[i];if(k==='active')c.active=v&&true;else c[k]=v;if(k==='rolls')normCls(c);if(k==='active'&&c.active&&!c.n)c.active=false;save();render()}
function seAddC(){const E=SE();E.classes.push({id:Date.now(),name:'',sem:'',rolls:'',n:0,active:true});save();render()}
function seDelC(i){SE().classes.splice(i,1);save();render()}
function seRm(i,k,v){const r=SE().rooms[i];r[k]=k==='cap'?+v||0:k==='active'?!!v:v;save();render()}
function seAddRm(){SE().rooms.push({name:'',cap:33,active:true});save();render()}
function seDelRm(i){SE().rooms.splice(i,1);save();render()}
function seDayAdd(){const v=$('#sdt').value,E=SE();if(!v||E.days.some(d=>d.date===v))return;const l=E.days[E.days.length-1];E.days.push({date:v,time:l?l.time:'9:15 AM-10:45 AM',sems:[...activeSems()]});E.days.sort((a,b)=>a.date<b.date?-1:1);save();render()}
function seDayK(i,k,v){SE().days[i][k]=v;save();render()}
function seDayDel(i){SE().days.splice(i,1);save();render()}
function seDayS(i,s){const a=SE().days[i].sems,k=a.indexOf(s);k<0?a.push(s):a.splice(k,1);save();render()}
function seR(di,ri,k,v){const r=SE().alloc[di].rows[ri];if(k==='n')r.n=+v||0;else{r[k]=v;if(k==='rolls'){const c=parseRolls(v).length;if(c)r.n=c}}save();render()}
function seAddR(di){SE().alloc[di].rows.push({room:'',cls:'',rolls:'',n:0});save();render()}
function seDelR(di,ri){SE().alloc[di].rows.splice(ri,1);save();render()}
function seD(di,k,v){SE().alloc[di][k]=v;save();render()}
/* excel */
function seatSheet(){const E=SE(),A=[['VIDYA ACADEMY OF SCIENCE AND TECHNOLOGY'],['Thalakkottukara, Thrissur 680501'],['Department of Computer Science and Engineering'],['Seating Arrangements for '+E.title],[],['Date','Class rooms','Roll Nos','Time','No of Students']],mg=[0,1,2,3].map(r=>({s:{r,c:0},e:{r,c:4}}));
 E.alloc.forEach(d=>{const rs=d.rows.length?d.rows:[null],r0=A.length;rs.forEach((r,i)=>A.push([i?'':dsh(d.date),r?r.room:'',r?r.cls+'('+r.rolls+')':'No exam',i?'':d.time,r?r.cls+' ('+r.n+')':'']));if(rs.length>1)mg.push({s:{r:r0,c:0},e:{r:r0+rs.length-1,c:0}},{s:{r:r0,c:3},e:{r:r0+rs.length-1,c:3}})});

 doc.setTextColor(0);doc.setFont('helvetica','bold');doc.setFontSize(12);['VIDYA ACADEMY OF SCIENCE AND TECHNOLOGY','Thalakkottukara, Thrissur 680501','Department of Computer Science and Engineering'].forEach((t,i)=>doc.text(t,w/2,32+i*5.5,{align:'center'}));doc.setFontSize(10);doc.text('Seating Arrangements for '+E.title,w/2,32+19,{align:'center'});

 doc.autoTable({startY:56,head:[['Date','Class rooms','Roll Nos','Time','No of Students']],body,theme:'grid',styles:{fontSize:8.5,cellPadding:1.6,halign:'center',lineColor:[110,110,110],lineWidth:.15,textColor:20},headStyles:{fillColor:[230,233,240],textColor:20},columnStyles:{0:{cellWidth:24},1:{cellWidth:26},2:{halign:'left'},3:{cellWidth:30},4:{halign:'left',cellWidth:38}},margin:{top:28,bottom:22,left:12,right:12},rowPageBreak:'avoid'});

/* views */
function vSeat(){const E=SE(),act=activeSems(),allS=[...new Set([...SEMLIST,...E.classes.map(c=>c.sem).filter(Boolean)])].sort(),noSem=E.classes.filter(c=>c.active&&!c.sem);
 const chips=allS.map(s=>{const l=E.classes.filter(c=>c.sem===s&&c.active),a=E.classes.filter(c=>c.sem===s);return l.length?`<span class="chip ok">${s}: ${l.length} class${l.length>1?'es':''}, ${l.reduce((x,c)=>x+c.n,0)} students</span>`:`<span class="chip mu">${s}: ${a.length?'no class this series, skipped':'not in sheet, skipped'}</span>`}).join('');
 const sel=(v,list)=>list.map(s=>`<option${s===v?' selected':''}>${s}</option>`).join('');
 return `<div class="card"><h2>Exam seating: classroom allocation</h2><p class="mu sm">Upload a sheet with the classes (S1, S3, S5, S7), the rooms and the exam days. Semesters that have no class, such as S7, are skipped automatically. Then generate, review, edit and download the arrangement as Excel or PDF.</p>
 <div class="row"><input type="file" accept=".xlsx,.xls" onchange="seatUp(this)"><button class="b" onclick="seatDemo()">Download demo sheet</button></div>${SU.msg?`<div class="${SU.ok?'ok':'er'} sm">${esc(SU.msg)}</div>`:''}
 <div class="row" style="margin-top:8px">${chips}</div>${noSem.length?`<div class="er sm">Semester not found for: ${noSem.map(c=>esc(c.name)||'(blank)').join(', ')}. Set the semester below or they will not be seated.</div>`:''}</div>
 <div class="card"><h2>Classes</h2><div class="sc"><table><tr><th>Class</th><th>Semester</th><th>Roll nos</th><th>Students</th><th>Has class</th><th></th></tr>${E.classes.map((c,i)=>`<tr class="${c.active?'':'x'}"><td><input value="${esc(c.name)}" onchange="seC(${i},'name',this.value)"></td><td><select onchange="seC(${i},'sem',this.value)">${sel(c.sem,['',...SEMS])}</select></td><td><input style="width:210px" value="${esc(c.rolls)}" onchange="seC(${i},'rolls',this.value)"></td><td>${c.n}</td><td><input type="checkbox" ${c.active?'checked':''} onchange="seC(${i},'active',this.checked)"></td><td><button class="b d" onclick="seDelC(${i})">×</button></td></tr>`).join('')||'<tr><td colspan="6" class="mu">No classes yet.</td></tr>'}</table></div><div class="row" style="margin-top:8px"><button class="b" onclick="seAddC()">Add class</button></div></div>
 <div class="card"><h2>Rooms</h2><div class="sc"><table><tr><th>Room</th><th>Capacity</th><th>Available</th><th></th></tr>${E.rooms.map((r,i)=>`<tr class="${r.active?'':'x'}"><td><input value="${esc(r.name)}" onchange="seRm(${i},'name',this.value)"></td><td><input type="number" min="1" value="${r.cap}" onchange="seRm(${i},'cap',this.value)"></td><td><input type="checkbox" ${r.active?'checked':''} onchange="seRm(${i},'active',this.checked)"></td><td><button class="b d" onclick="seDelRm(${i})">×</button></td></tr>`).join('')||'<tr><td colspan="4" class="mu">No rooms yet.</td></tr>'}</table></div><div class="row" style="margin-top:8px"><button class="b" onclick="seAddRm()">Add room</button><span class="mu sm">${E.rooms.filter(r=>r.active).reduce((a,r)=>a+r.cap,0)} seats in ${E.rooms.filter(r=>r.active).length} available rooms</span></div></div>
 <div class="card"><h2>Exam days</h2><div class="row"><input type="date" id="sdt"><button class="b" onclick="seDayAdd()">Add exam day</button><span class="mu sm">Tick the semesters writing on that day. Each day's rooms are allocated afresh.</span></div>
 <div class="sc"><table><tr><th>Date</th><th>Time</th><th>Semesters in exam</th><th>Students</th><th></th></tr>${E.days.map((d,i)=>{const tot=E.classes.filter(c=>c.active&&d.sems.includes(c.sem)).reduce((a,c)=>a+c.n,0);return `<tr><td><input type="date" value="${d.date}" onchange="seDayK(${i},'date',this.value)"></td><td><input value="${esc(d.time)}" onchange="seDayK(${i},'time',this.value)"></td><td class="n">${allS.map(s=>`<label class="k"><input type="checkbox" ${d.sems.includes(s)?'checked':''} ${act.includes(s)?'':'disabled'} onchange="seDayS(${i},'${s}')">${s}</label>`).join('')}</td><td>${tot}</td><td><button class="b d" onclick="seDayDel(${i})">×</button></td></tr>`}).join('')||'<tr><td colspan="5" class="mu">No days yet.</td></tr>'}</table></div>
 <div class="row" style="margin-top:10px"><input style="flex:1;min-width:240px" placeholder="Title, e.g. Second Series Examination November 2026" value="${esc(E.title)}" onchange="SE().title=this.value;save()"><button class="b p" onclick="seatGenerate()">${E.alloc?'Regenerate':'Generate seating'}</button></div></div>${vSeatReview()}`}

 return `<div class="card"><h2>${esc(E.title)} <span class="mu">· seating arrangement</span></h2><div class="row mu sm">Generated on: ${E.gen}</div>

 <div class="row sm ${er?'er':'ok'}">${er?'✗ '+er+' problem'+(er>1?'s':'')+' to fix':'✓ Every class is fully seated and no room is over capacity.'}</div>${iss.map(x=>`<div class="sm ${x.t==='e'?'er':'mu'}">${x.t==='e'?'✗':'!'} ${esc(x.m)}</div>`).join('')}
 ${rl}<div class="sc" style="margin-top:8px"><table><tr><th>Date</th><th>Class rooms</th><th>Roll Nos</th><th>Time</th><th>No of Students</th></tr>${body}</table></div>
 ${ed?'<p class="mu sm">Edit mode: change a room, class, roll numbers or the count, add a row with "+ row", or remove one with ×. The student count follows the roll numbers when you edit them. Click Done editing when finished.</p>':''}</div>`}
